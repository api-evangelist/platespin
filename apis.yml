name: Platespin
description: >-
  PlateSpin is a workload virtualization, migration, and protection product line
  (PlateSpin Migrate, PlateSpin Protect, PlateSpin Forge) originally built by
  PlateSpin Ltd., acquired by Novell in 2008, subsequently owned by Micro Focus
  and then OpenText. It is not an independent company: the platespin.com domain
  301-redirects to Novell's virtualization/workload solutions page and resolves
  to a Novell IP (130.57.66.19), with the TLS certificate owned by Micro Focus
  (*.microfocus.com, *.netiq.com). This record was created from an
  insight-partners VC-portfolio scrape and is a false match against the legacy
  PlateSpin brand; there is no independent developer portal, public API, or
  discoverable developer.* / docs.* / api.* surface for PlateSpin as a standalone
  provider.
